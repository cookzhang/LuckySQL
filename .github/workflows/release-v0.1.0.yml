name: Publish v0.1.0

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Publish LuckySQL v0.1.0'
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          set +e
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            {
              echo "### Swift test failure"
              echo '```text'
              tail -n 120 "$RUNNER_TEMP/swift-test.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Package Apple Silicon app
        run: ./scripts/package-release.sh 0.1.0

      - name: Write release notes
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          LuckySQL v0.1.0 is the first runnable MVP of the native macOS MySQL client.

          Highlights:
          - Native Swift + SwiftUI interface for macOS 14+
          - MySQL connection profiles with Keychain password storage
          - Database, schema, and table navigation
          - SQL editor with Command–Return execution
          - Query result grid and table data browsing
          - Apple Silicon release build

          Installation:
          1. Download and unzip `LuckySQL-v0.1.0-macos-arm64.zip`.
          2. Move `LuckySQL.app` to Applications.
          3. This community build is ad-hoc signed and not notarized. On first launch, right-click the app, choose **Open**, and confirm.

          Security note: this MVP currently uses direct non-TLS MySQL connections. Use localhost or a trusted private network.
          NOTES

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            dist/LuckySQL-v0.1.0-macos-arm64.zip \
            dist/LuckySQL-v0.1.0-macos-arm64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "LuckySQL v0.1.0" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
